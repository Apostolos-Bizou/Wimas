<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>WIMA ERP — Training Management Platform</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
  <!-- Ant Design CSS -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/antd/5.12.8/reset.min.css">
  <style>
    /* ============================================
       WIMA ERP — Design System
       Maritime Professional · Dark Navy Theme
    ============================================ */

    :root {
      /* Brand Colors — extracted from wimas.io */
      --wima-navy:        #0B1120;
      --wima-navy-mid:    #111827;
      --wima-navy-light:  #1A2640;
      --wima-navy-border: #1E2F4A;
      --wima-teal:        #0EA5E9;
      --wima-teal-dim:    #0284C7;
      --wima-teal-glow:   rgba(14,165,233,0.15);
      --wima-white:       #F8FAFC;
      --wima-muted:       #64748B;
      --wima-muted-light: #94A3B8;
      --wima-surface:     #141E2E;
      --wima-surface-2:   #1C2A3E;
      --wima-green:       #10B981;
      --wima-orange:      #F59E0B;
      --wima-red:         #EF4444;
      --wima-purple:      #8B5CF6;

      /* Sidebar */
      --sidebar-width:    240px;
      --sidebar-collapsed: 64px;
      --header-height:    60px;

      /* Typography */
      --font-main: 'Sora', sans-serif;
      --font-mono: 'DM Mono', monospace;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: var(--font-main);
      background: var(--wima-navy);
      color: var(--wima-white);
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* ============================================
       LAYOUT SHELL
    ============================================ */

    .app-shell {
      display: flex;
      height: 100vh;
      overflow: hidden;
    }

    /* ============================================
       SIDEBAR
    ============================================ */

    .sidebar {
      width: var(--sidebar-width);
      min-width: var(--sidebar-width);
      background: var(--wima-navy-mid);
      border-right: 1px solid var(--wima-navy-border);
      display: flex;
      flex-direction: column;
      height: 100vh;
      position: relative;
      transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
      z-index: 100;
    }

    .sidebar.collapsed {
      width: var(--sidebar-collapsed);
      min-width: var(--sidebar-collapsed);
    }

    /* Logo Area */
    .sidebar-logo {
      height: var(--header-height);
      display: flex;
      align-items: center;
      padding: 0 16px;
      border-bottom: 1px solid var(--wima-navy-border);
      gap: 10px;
      overflow: hidden;
      flex-shrink: 0;
    }

    .logo-icon {
      width: 32px;
      height: 32px;
      flex-shrink: 0;
      background: var(--wima-teal);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 14px;
      color: white;
      letter-spacing: -0.5px;
    }

    .logo-text {
      display: flex;
      flex-direction: column;
      opacity: 1;
      transition: opacity 0.2s;
      white-space: nowrap;
    }

    .sidebar.collapsed .logo-text { opacity: 0; pointer-events: none; }

    .logo-name {
      font-size: 15px;
      font-weight: 700;
      color: var(--wima-white);
      letter-spacing: 0.5px;
    }

    .logo-tagline {
      font-size: 9px;
      color: var(--wima-muted);
      letter-spacing: 0.8px;
      text-transform: uppercase;
      margin-top: 1px;
    }

    /* Nav Sections */
    .sidebar-nav {
      flex: 1;
      overflow-y: auto;
      overflow-x: hidden;
      padding: 12px 0;
      scrollbar-width: none;
    }
    .sidebar-nav::-webkit-scrollbar { display: none; }

    .nav-section-label {
      font-size: 9px;
      font-weight: 600;
      letter-spacing: 1.2px;
      text-transform: uppercase;
      color: var(--wima-muted);
      padding: 16px 20px 6px;
      white-space: nowrap;
      overflow: hidden;
      transition: opacity 0.2s;
    }

    .sidebar.collapsed .nav-section-label { opacity: 0; }

    .nav-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 9px 16px;
      margin: 1px 8px;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.15s;
      position: relative;
      white-space: nowrap;
      overflow: hidden;
    }

    .nav-item:hover {
      background: var(--wima-navy-light);
      color: var(--wima-white);
    }

    .nav-item.active {
      background: var(--wima-teal-glow);
      color: var(--wima-teal);
    }

    .nav-item.active::before {
      content: '';
      position: absolute;
      left: 0;
      top: 6px;
      bottom: 6px;
      width: 3px;
      background: var(--wima-teal);
      border-radius: 0 3px 3px 0;
      margin-left: -8px;
    }

    .nav-icon {
      width: 32px;
      height: 32px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      font-size: 16px;
    }

    .nav-label {
      font-size: 13px;
      font-weight: 500;
      transition: opacity 0.2s;
    }

    .sidebar.collapsed .nav-label { opacity: 0; }

    .nav-badge {
      margin-left: auto;
      background: var(--wima-teal);
      color: white;
      font-size: 10px;
      font-weight: 600;
      padding: 1px 6px;
      border-radius: 10px;
      font-family: var(--font-mono);
      transition: opacity 0.2s;
    }
    .sidebar.collapsed .nav-badge { opacity: 0; }

    /* Sidebar Footer */
    .sidebar-footer {
      border-top: 1px solid var(--wima-navy-border);
      padding: 12px 8px;
      flex-shrink: 0;
    }

    .user-card {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px;
      border-radius: 8px;
      cursor: pointer;
      overflow: hidden;
      transition: background 0.15s;
    }
    .user-card:hover { background: var(--wima-navy-light); }

    .user-avatar {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--wima-teal), #0052CC);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      font-weight: 700;
      flex-shrink: 0;
      color: white;
    }

    .user-info { overflow: hidden; transition: opacity 0.2s; }
    .sidebar.collapsed .user-info { opacity: 0; }

    .user-name {
      font-size: 12px;
      font-weight: 600;
      color: var(--wima-white);
      white-space: nowrap;
    }

    .user-role {
      font-size: 10px;
      color: var(--wima-teal);
      white-space: nowrap;
    }

    /* Collapse Toggle */
    .collapse-btn {
      position: absolute;
      right: -12px;
      top: 72px;
      width: 24px;
      height: 24px;
      background: var(--wima-navy-border);
      border: 1px solid var(--wima-navy-border);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 10px;
      color: var(--wima-muted);
      transition: all 0.15s;
      z-index: 10;
    }
    .collapse-btn:hover { background: var(--wima-teal); color: white; border-color: var(--wima-teal); }

    /* ============================================
       MAIN CONTENT AREA
    ============================================ */

    .main-area {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      min-width: 0;
    }

    /* ============================================
       TOP HEADER
    ============================================ */

    .header {
      height: var(--header-height);
      background: var(--wima-navy-mid);
      border-bottom: 1px solid var(--wima-navy-border);
      display: flex;
      align-items: center;
      padding: 0 24px;
      gap: 16px;
      flex-shrink: 0;
    }

    .header-breadcrumb {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 13px;
      color: var(--wima-muted);
    }

    .header-breadcrumb .current {
      color: var(--wima-white);
      font-weight: 500;
    }

    .header-breadcrumb .sep { color: var(--wima-navy-border); }

    .header-search {
      flex: 1;
      max-width: 360px;
      margin-left: 24px;
    }

    .search-input-wrap {
      display: flex;
      align-items: center;
      gap: 8px;
      background: var(--wima-navy-light);
      border: 1px solid var(--wima-navy-border);
      border-radius: 8px;
      padding: 6px 12px;
      transition: border-color 0.15s;
    }

    .search-input-wrap:focus-within {
      border-color: var(--wima-teal);
      background: var(--wima-surface-2);
    }

    .search-input-wrap input {
      background: none;
      border: none;
      outline: none;
      font-family: var(--font-main);
      font-size: 13px;
      color: var(--wima-white);
      width: 100%;
    }

    .search-input-wrap input::placeholder { color: var(--wima-muted); }

    .search-icon { color: var(--wima-muted); font-size: 14px; }

    .header-right {
      margin-left: auto;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .header-btn {
      width: 36px;
      height: 36px;
      border-radius: 8px;
      background: var(--wima-navy-light);
      border: 1px solid var(--wima-navy-border);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 15px;
      color: var(--wima-muted);
      transition: all 0.15s;
      position: relative;
    }
    .header-btn:hover { border-color: var(--wima-teal); color: var(--wima-teal); }

    .notif-dot {
      position: absolute;
      top: 6px;
      right: 6px;
      width: 7px;
      height: 7px;
      background: var(--wima-red);
      border-radius: 50%;
      border: 1.5px solid var(--wima-navy-mid);
    }

    /* ============================================
       PAGE CONTENT
    ============================================ */

    .page-content {
      flex: 1;
      overflow-y: auto;
      padding: 28px 28px;
      background: var(--wima-navy);
      scrollbar-width: thin;
      scrollbar-color: var(--wima-navy-border) transparent;
    }

    .page-content::-webkit-scrollbar { width: 5px; }
    .page-content::-webkit-scrollbar-thumb { background: var(--wima-navy-border); border-radius: 10px; }

    /* Page Header */
    .page-header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      margin-bottom: 28px;
    }

    .page-title {
      font-size: 22px;
      font-weight: 700;
      color: var(--wima-white);
      letter-spacing: -0.3px;
    }

    .page-subtitle {
      font-size: 13px;
      color: var(--wima-muted);
      margin-top: 3px;
    }

    .page-actions {
      display: flex;
      gap: 8px;
    }

    /* ============================================
       COMPONENTS — Cards, Buttons, Stats
    ============================================ */

    /* Stat Cards */
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 16px;
      margin-bottom: 24px;
    }

    .stat-card {
      background: var(--wima-surface);
      border: 1px solid var(--wima-navy-border);
      border-radius: 12px;
      padding: 20px;
      position: relative;
      overflow: hidden;
      transition: border-color 0.2s;
    }

    .stat-card:hover { border-color: var(--wima-teal-dim); }

    .stat-card::after {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 2px;
      border-radius: 12px 12px 0 0;
    }
    .stat-card.teal::after  { background: var(--wima-teal); }
    .stat-card.green::after { background: var(--wima-green); }
    .stat-card.orange::after{ background: var(--wima-orange); }
    .stat-card.red::after   { background: var(--wima-red); }

    .stat-icon {
      width: 40px;
      height: 40px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      margin-bottom: 14px;
    }

    .stat-icon.teal   { background: rgba(14,165,233,0.12); }
    .stat-icon.green  { background: rgba(16,185,129,0.12); }
    .stat-icon.orange { background: rgba(245,158,11,0.12); }
    .stat-icon.red    { background: rgba(239,68,68,0.12); }

    .stat-value {
      font-size: 28px;
      font-weight: 700;
      color: var(--wima-white);
      font-family: var(--font-mono);
      letter-spacing: -1px;
      line-height: 1;
    }

    .stat-label {
      font-size: 12px;
      color: var(--wima-muted);
      margin-top: 5px;
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .stat-delta {
      font-size: 11px;
      margin-top: 8px;
      display: flex;
      align-items: center;
      gap: 3px;
    }
    .stat-delta.up   { color: var(--wima-green); }
    .stat-delta.warn { color: var(--wima-orange); }
    .stat-delta.down { color: var(--wima-red); }

    /* Content Cards */
    .card {
      background: var(--wima-surface);
      border: 1px solid var(--wima-navy-border);
      border-radius: 12px;
      overflow: hidden;
    }

    .card-header {
      padding: 16px 20px;
      border-bottom: 1px solid var(--wima-navy-border);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .card-title {
      font-size: 14px;
      font-weight: 600;
      color: var(--wima-white);
    }

    .card-body { padding: 20px; }

    /* Grid 2-col */
    .grid-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }

    .grid-3 {
      display: grid;
      grid-template-columns: 2fr 1fr;
      gap: 16px;
    }

    /* Buttons */
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 8px 16px;
      border-radius: 8px;
      font-family: var(--font-main);
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.15s;
      border: none;
      white-space: nowrap;
    }

    .btn-primary {
      background: var(--wima-teal);
      color: white;
    }
    .btn-primary:hover { background: var(--wima-teal-dim); transform: translateY(-1px); }

    .btn-secondary {
      background: var(--wima-navy-light);
      color: var(--wima-muted-light);
      border: 1px solid var(--wima-navy-border);
    }
    .btn-secondary:hover { border-color: var(--wima-teal); color: var(--wima-teal); }

    .btn-ghost {
      background: transparent;
      color: var(--wima-muted);
      border: 1px solid transparent;
    }
    .btn-ghost:hover { color: var(--wima-teal); background: var(--wima-teal-glow); }

    .btn-danger {
      background: rgba(239,68,68,0.12);
      color: var(--wima-red);
      border: 1px solid rgba(239,68,68,0.2);
    }
    .btn-danger:hover { background: var(--wima-red); color: white; }

    /* Status Badges */
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 3px 8px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.2px;
    }

    .badge::before {
      content: '';
      width: 5px;
      height: 5px;
      border-radius: 50%;
    }

    .badge-teal   { background: var(--wima-teal-glow);        color: var(--wima-teal);   }
    .badge-teal::before { background: var(--wima-teal); }
    .badge-green  { background: rgba(16,185,129,0.12);  color: var(--wima-green);  }
    .badge-green::before { background: var(--wima-green); }
    .badge-orange { background: rgba(245,158,11,0.12);  color: var(--wima-orange); }
    .badge-orange::before { background: var(--wima-orange); }
    .badge-red    { background: rgba(239,68,68,0.12);   color: var(--wima-red);    }
    .badge-red::before { background: var(--wima-red); }
    .badge-muted  { background: rgba(100,116,139,0.12); color: var(--wima-muted);  }
    .badge-muted::before { background: var(--wima-muted); }

    /* ============================================
       TABLE
    ============================================ */

    .wima-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
    }

    .wima-table thead tr {
      border-bottom: 1px solid var(--wima-navy-border);
    }

    .wima-table th {
      padding: 10px 16px;
      text-align: left;
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      color: var(--wima-muted);
    }

    .wima-table td {
      padding: 12px 16px;
      color: var(--wima-muted-light);
      border-bottom: 1px solid rgba(30,47,74,0.5);
    }

    .wima-table tbody tr {
      transition: background 0.12s;
    }

    .wima-table tbody tr:hover {
      background: var(--wima-navy-light);
      cursor: pointer;
    }

    .wima-table tbody tr:hover td { color: var(--wima-white); }

    .td-primary {
      color: var(--wima-white) !important;
      font-weight: 500;
    }

    .td-mono {
      font-family: var(--font-mono);
      font-size: 12px;
      color: var(--wima-teal) !important;
    }

    /* ============================================
       NOTIFICATIONS / ALERTS
    ============================================ */

    .alert-item {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      padding: 12px;
      border-radius: 8px;
      border: 1px solid var(--wima-navy-border);
      background: var(--wima-navy-light);
      margin-bottom: 8px;
      cursor: pointer;
      transition: border-color 0.15s;
    }

    .alert-item:hover { border-color: var(--wima-teal); }

    .alert-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      margin-top: 4px;
      flex-shrink: 0;
    }

    .alert-text { font-size: 12px; color: var(--wima-muted-light); line-height: 1.5; }
    .alert-text strong { color: var(--wima-white); display: block; font-size: 12.5px; margin-bottom: 2px; }
    .alert-time { font-size: 10px; color: var(--wima-muted); font-family: var(--font-mono); }

    /* ============================================
       MINI CHART BARS (CSS only)
    ============================================ */

    .bar-chart {
      display: flex;
      align-items: flex-end;
      gap: 6px;
      height: 60px;
      padding: 0 4px;
    }

    .bar {
      flex: 1;
      background: var(--wima-teal-glow);
      border-radius: 3px 3px 0 0;
      border: 1px solid rgba(14,165,233,0.2);
      border-bottom: none;
      transition: background 0.2s;
    }
    .bar:hover { background: var(--wima-teal); }
    .bar.active { background: var(--wima-teal); }

    /* ============================================
       PROGRESS / COMPLIANCE
    ============================================ */

    .progress-bar-wrap {
      background: var(--wima-navy-light);
      border-radius: 4px;
      height: 6px;
      overflow: hidden;
    }

    .progress-bar {
      height: 100%;
      border-radius: 4px;
      transition: width 0.6s ease;
    }

    /* ============================================
       SCROLLBAR GLOBAL
    ============================================ */

    ::-webkit-scrollbar { width: 5px; height: 5px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--wima-navy-border); border-radius: 10px; }

    /* ============================================
       UTILITY
    ============================================ */

    .flex { display: flex; }
    .flex-col { display: flex; flex-direction: column; }
    .items-center { align-items: center; }
    .justify-between { justify-content: space-between; }
    .gap-2 { gap: 8px; }
    .gap-3 { gap: 12px; }
    .gap-4 { gap: 16px; }
    .mb-2 { margin-bottom: 8px; }
    .mb-3 { margin-bottom: 12px; }
    .mb-4 { margin-bottom: 16px; }
    .mb-6 { margin-bottom: 24px; }
    .text-muted { color: var(--wima-muted); }
    .text-teal { color: var(--wima-teal); }
    .text-small { font-size: 12px; }
    .text-mono { font-family: var(--font-mono); }
    .w-full { width: 100%; }
    .avatar-sm {
      width: 30px; height: 30px; border-radius: 50%;
      background: linear-gradient(135deg, #0EA5E9, #6366F1);
      display:flex; align-items:center; justify-content:center;
      font-size:11px; font-weight:700; color:white; flex-shrink:0;
    }

    /* ============================================
       PAGE TABS
    ============================================ */

    .page-tabs {
      display: flex;
      gap: 0;
      border-bottom: 1px solid var(--wima-navy-border);
      margin-bottom: 24px;
    }

    .tab {
      padding: 10px 18px;
      font-size: 13px;
      font-weight: 500;
      color: var(--wima-muted);
      cursor: pointer;
      border-bottom: 2px solid transparent;
      margin-bottom: -1px;
      transition: all 0.15s;
    }

    .tab:hover { color: var(--wima-white); }
    .tab.active { color: var(--wima-teal); border-bottom-color: var(--wima-teal); }

    /* ============================================
       SCHEDULE / CALENDAR MINI
    ============================================ */

    .schedule-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 0;
      border-bottom: 1px solid var(--wima-navy-border);
    }

    .schedule-item:last-child { border-bottom: none; }

    .schedule-date {
      width: 44px;
      text-align: center;
      flex-shrink: 0;
    }

    .schedule-day {
      font-size: 18px;
      font-weight: 700;
      font-family: var(--font-mono);
      color: var(--wima-white);

  return items.map(i => `

        <div class="schedule-day">${i.day}</div>
        <div class="schedule-month">${i.month}</div>

      <div class="schedule-line" style="background:${i.color}"></div>
      <div class="schedule-info">
        <div class="schedule-course">${i.course}</div>
        <div class="schedule-meta">${i.meta}</div>
      </div>
      <div class="schedule-seats text-mono">${i.seats}</div>
    </div>
  `).join('');
}

function otrItems(items) {
  return items.map(i => `
    <div class="flex items-center gap-3 mb-3" style="padding-bottom:10px;border-bottom:1px solid var(--wima-navy-border)">
      <div>
        <div class="flex items-center gap-2 mb-1">

          ${i.urgency === 'urgent' ? '<span class="badge badge-red">URGENT</span>' : '<span class="badge badge-muted">Normal</span>'}
        </div>
        <div style="font-size:13px;font-weight:500;color:var(--wima-white)">${i.seafarer}</div>
        <div class="text-small text-muted">${i.principal}</div>
      </div>
      <button class="btn btn-primary" style="margin-left:auto;padding:5px 10px;font-size:12px">Assign →</button>
    </div>
  `).join('');
}

function topCourses(items) {

      </div>
      <div class="progress-bar-wrap">
        <div class="progress-bar" style="width:${i.pct}%;background:var(--wima-teal)"></div>
      </div>
    </div>
  `).join('');
}

    return `

        <td><div class="flex items-center gap-2">
          <div class="avatar-sm">${r.init}</div>
          <span class="td-primary">${r.name}</span>
        </div></td>

        <td>${r.rank}</td>
        <td>${r.principal}</td>
        <td><span class="badge ${c.badge}">${c.label}</span></td>
        <td class="text-mono" style="font-size:12px">${r.date}</td>

    return `
      <tr>
        <td class="td-mono">${r.num}${r.urgent ? ' <span class="badge badge-red" style="font-size:9px">🔴</span>' : ''}</td>
        <td><div class="flex items-center gap-2">
          <div class="avatar-sm">${r.init}</div>
          <span class="td-primary">${r.name}</span>
        </div></td>
        <td style="font-size:12px">${r.courses.map(c => `<span class="badge badge-muted" style="margin:1px">${c}</span>`).join('')}</td>
        <td>${r.principal}</td>
        <td style="font-size:12px;color:var(--wima-muted-light)">${r.center}</td>
        <td><span class="badge ${s.badge}">${s.label}</span></td>
        <td class="text-mono" style="font-size:12px">${r.date}</td>
        <td><div class="flex gap-2">
          <button class="btn btn-ghost" style="padding:4px 8px;font-size:11px">View</button>
          ${r.status === 'pending' ? '<button class="btn btn-primary" style="padding:4px 8px;font-size:11px">Assign</button>' : ''}
        </div></td>
      </tr>
    `;
  }).join('');
}

function placeholder(icon, title, desc) {
  return `
    <div class="page-header">
      <div>
        <div class="page-title">${icon} ${title}</div>
        <div class="page-subtitle">${desc}</div>
      </div>
    </div>
    <div class="card" style="padding:60px;text-align:center">
      <div style="font-size:48px;margin-bottom:16px;opacity:0.4">${icon}</div>
      <div style="font-size:18px;font-weight:600;color:var(--wima-white);margin-bottom:8px">${title}</div>
      <div style="color:var(--wima-muted);font-size:14px;max-width:400px;margin:0 auto">${desc}</div>
      <div style="margin-top:24px">
        <span class="badge badge-teal" style="font-size:12px;padding:6px 14px">Coming up next sprint</span>
      </div>
    </div>
  `;
}

/* ============================================================
   ROUTER
============================================================ */

let currentPage = 'dashboard';

function showPage(id) {
  if (id === 'login') {
    alert('Logout — Login page coming in next sprint!');
    return;
  }
  const page = PAGES[id];
  if (!page) return;
  currentPage = id;

  // Update breadcrumb
  document.getElementById('breadcrumb-current').textContent = page.breadcrumb;

  // Update sidebar active
  document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
  // Simple match by click order
  document.querySelectorAll('.nav-item').forEach(el => {
    if (el.getAttribute('onclick') === `showPage('${id}')`) el.classList.add('active');
  });

  // Render page
  document.getElementById('page-content').innerHTML = page.render();
}

function toggleSidebar() {
  const sb = document.getElementById('sidebar');
  const icon = document.getElementById('collapse-icon');
  sb.classList.toggle('collapsed');
  icon.textContent = sb.classList.contains('collapsed') ? '▶' : '◀';
}

/* Init */
showPage('dashboard');
</script>
